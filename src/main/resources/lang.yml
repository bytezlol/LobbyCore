# ==========================================================================
# Language Configuration
# All messages support MiniMessage formatting:
# https://docs.advntr.dev/minimessage/format.html
# ==========================================================================

# Prefix prepended to every message.
prefix: "&#00C6FB&lLOBBY &7» "

# ==========================================================================
# Command Messages
# ==========================================================================
no-permission: "&fYou don't have permissions for that."
usage: "&fUsage: &#00C6FB/lobbycore <reload>"

reload-success: "&fThe Configuration has been reloaded!"
reload-failed: "&fError whilst reloading the config &7(%error%)"

# ==========================================================================
# Join & Leave Messages
# Note: 'prefix' above is NOT prepended to these — use full styling here.
# Placeholder: %player%
# ==========================================================================
join-message: "<dark_gray>[<#00C6FB>+<dark_gray>] <gray>%player%"
leave-message: "<dark_gray>[<#FC1F3C>-<dark_gray>] <gray>%player%"

# ==========================================================================
# Store & Discord Commands
# ==========================================================================
